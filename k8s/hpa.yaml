apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: glowfront
  namespace: glowfront
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: glowfront
  # Pinned to a single replica for now; raise maxReplicas to let it scale on CPU again.
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
